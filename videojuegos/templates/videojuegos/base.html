{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Zona Arcade{% endblock %} | Tienda de Videojuegos</title>
    <link rel="stylesheet" href="{% static 'videojuegos/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'videojuegos/css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'videojuegos/css/estilos.css' %}">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN (se repite en todas las páginas porque está en base.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}"><i class="bi bi-controller"></i> Zona Arcade</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'inicio' %}"><i class="bi bi-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'videojuego_lista' %}"><i class="bi bi-grid"></i> Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'videojuego_crear' %}"><i class="bi bi-plus-circle"></i> Agregar juego</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <!-- MENSAJES de éxito (vienen de messages.success en views.py) -->
        {% for mensaje in messages %}
            <div class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle"></i> {{ mensaje }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}

        <!-- Aquí cada página pone su propio contenido -->
        {% block contenido %}{% endblock %}
    </main>

    <footer class="text-center py-3 small bg-light border-top">
        Zona Arcade &middot; 2026
    </footer>

    <script src="{% static 'videojuegos/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
