{% extends 'videojuegos/base.html' %}
{% block titulo %}Agregar videojuego{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="form-box p-4">
            <h2 class="mb-1"><i class="bi bi-plus-circle text-success"></i> Agregar videojuego</h2>
            <p class="text-secondary">Completa los datos del nuevo juego para sumarlo al catálogo.</p>

            <!-- method="post": los datos se envían a la vista videojuego_crear -->
            <!-- novalidate: desactiva la validación del navegador para que se vean las de Django -->
            <form method="post" novalidate>
                {% csrf_token %}   <!-- token de seguridad obligatorio en formularios POST -->
                {% include 'videojuegos/_campos.html' %}
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar videojuego</button>
                    <a href="{% url 'videojuego_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
